<title>Helix in Wonderland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&family=VT323&display=swap">
<style>
/* Layout: Helix-terminal frame (default "revolver" theme colours) around a 5:3 pixel stage, then objective panel, statusline, on-screen keyboard */
:root{
  color-scheme: dark;
  --deep:#1a0f22; --revolver:#281733; --midnight:#3b224c; --plum:#4d2d63;
  --lilac:#dbbfef; --lavender:#a4a0e8; --muted:#9a86b0;
  --honey:#efba5d; --mint:#9ff28f; --apricot:#f47868; --sel:#540099; --ink:#120a18;
  --f-display:'Silkscreen', ui-monospace, monospace;
  --f-body:'Pixelify Sans', system-ui, sans-serif;
  --f-mono:'VT323', ui-monospace, monospace;
  --kw: clamp(22px, 6.2vw, 48px);
}
html,body{background:var(--deep);color:var(--lilac)}
body{font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:14px 28px;display:flex;flex-direction:column;gap:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,li:focus-visible{outline:2px solid var(--honey);outline-offset:2px}
kbd{font-family:var(--f-mono);font-size:1.15em;background:var(--midnight);border-bottom:2px solid var(--ink);padding:0 .35em;color:var(--lilac)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:14px;color:var(--lavender);letter-spacing:.04em}
.brand b{color:var(--honey);font-weight:400}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;border:2px solid var(--plum);background:var(--revolver)}
.seg button,.plain{background:transparent;border:0;color:var(--muted);font-family:var(--f-display);font-size:11px;padding:6px 9px;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--plum);color:var(--lilac)}
.plain{border:2px solid var(--plum);background:var(--revolver)}
.plain:hover,.seg button:hover{color:var(--lilac)}

#stage{position:relative;background:var(--ink);box-shadow:0 0 0 3px var(--ink),0 0 0 6px var(--plum);overflow:hidden}
#scene{display:block;width:100%;height:auto;aspect-ratio:5/3;image-rendering:pixelated;max-width:100%}
#editorWrap{display:flex;flex-direction:column}
#banner{display:block;width:100%;height:auto;aspect-ratio:320/56;image-rendering:pixelated;max-width:100%}
#editor{font-family:var(--f-mono);font-size:clamp(19px,2.5vw,26px);line-height:1.3;padding-block:12px;background:var(--revolver);min-height:300px;overflow-x:auto}
.ln{display:flex;white-space:pre;min-width:max-content;padding-right:16px}
.gut{width:4ch;flex:none;text-align:right;padding-right:1.2ch;color:var(--plum)}
.ln.on .gut{color:var(--lilac)}
.code .sel{background:var(--sel)}
.code .cur{background:var(--lilac);color:var(--revolver)}
.code .bar{box-shadow:inset 3px 0 0 var(--honey)}

#overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(18,10,24,.66);overflow:auto;padding:16px}
.card{background:var(--revolver);border:3px solid var(--plum);box-shadow:6px 6px 0 var(--ink);padding:20px 22px;max-width:580px;width:100%;display:flex;flex-direction:column;gap:12px}
.logo{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(22px,4.4vw,40px);line-height:1.1;color:var(--lilac);text-shadow:3px 3px 0 var(--sel);text-wrap:balance}
.logo .hx{color:var(--honey)}
.logo small{font-size:.55em;color:var(--lavender)}
.tag{margin:0;color:var(--muted);max-width:60ch}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.chapters li{display:grid;grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;padding:7px 10px;border:2px solid transparent;cursor:pointer}
.chapters li.sel{border-color:var(--honey);background:var(--midnight)}
.chapters li.locked{opacity:.45;cursor:not-allowed}
.num{font-family:var(--f-display);color:var(--honey);font-size:18px}
.cname{font-weight:600;display:block}
.cskill{font-size:14px;color:var(--muted);display:block;min-width:0}
.ctarts{display:flex;gap:2px;align-items:center;font-family:var(--f-display);font-size:10px;color:var(--muted)}
.ctarts img{width:20px;image-rendering:pixelated}
.ctarts img.dim{opacity:.22;filter:grayscale(1)}
.hint{margin:0;font-family:var(--f-display);font-size:11px;color:var(--lavender);letter-spacing:.04em}
.touch{display:none;margin:0;color:var(--apricot)}
@media (pointer:coarse){.touch{display:block}}
.tarts{display:flex;gap:10px}
.tarts img{width:56px;image-rendering:pixelated}
.tarts img.dim{opacity:.2;filter:grayscale(1)}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--f-display);font-size:10px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.stats b{display:block;font-family:var(--f-mono);font-weight:400;font-size:24px;color:var(--lilac);text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions button{background:var(--midnight);border:2px solid var(--plum);padding:8px 12px;font-family:var(--f-display);font-size:11px}
.actions button.primary{background:var(--honey);color:var(--ink);border-color:var(--honey)}
.lesson{margin:0;font-family:var(--f-mono);font-size:22px;color:var(--honey)}
h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px;text-wrap:balance}

#dialog{position:absolute;left:12px;right:12px;bottom:12px;background:var(--revolver);border:3px solid var(--lilac);box-shadow:4px 4px 0 var(--ink);display:flex;gap:12px;padding:10px 12px;align-items:flex-start}
#portrait{width:48px;height:48px;flex:none;image-rendering:pixelated;background:var(--midnight)}
#portrait.none{display:none}
.dbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.who{font-family:var(--f-display);font-size:11px;color:var(--honey);letter-spacing:.08em;text-transform:uppercase}
.dtxt{font-size:clamp(15px,1.9vw,19px);min-height:2.9em}
.dnext{align-self:flex-end;font-family:var(--f-display);font-size:10px;color:var(--lavender);animation:blink 1s steps(2) infinite}
.dnext.nudge{color:var(--honey);animation:nudge .3s 2}
@keyframes blink{50%{opacity:.25}}
@keyframes nudge{50%{transform:translateX(-4px)}}

#toast{position:absolute;top:10px;left:50%;transform:translate(-50%,-8px);background:var(--honey);color:var(--ink);font-family:var(--f-display);font-size:11px;padding:6px 10px;max-width:90%;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:3px 3px 0 var(--ink);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#focusPrompt{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:var(--lilac);color:var(--ink);border:0;font-family:var(--f-display);font-size:11px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);z-index:3;max-width:90%}

#panel{background:var(--revolver);border-left:4px solid var(--lavender);padding:12px 14px;min-height:64px;display:flex;flex-direction:column;gap:8px}
#panel p{margin:0}
.ptag{font-family:var(--f-display);font-size:10px;letter-spacing:.06em;color:var(--lavender);text-transform:uppercase}
.big{font-size:18px}
.meter{height:8px;background:var(--midnight)}
.meter i{display:block;height:100%;background:var(--mint);transition:width .2s}
.words{font-family:var(--f-mono);font-size:clamp(26px,4vw,40px);display:flex;flex-wrap:wrap;gap:.2em .6em;line-height:1.1}
.word.done{color:var(--plum)}
.word.next{color:var(--muted)}
.word.now .ok{color:var(--mint)}
.word.now .cur{border-bottom:3px solid var(--honey)}
.word.now .err{color:var(--apricot);border-color:var(--apricot)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.checklist li{padding-left:2.4em;position:relative}
.checklist li::before{content:"[ ]";position:absolute;left:0;font-family:var(--f-mono);font-size:20px;line-height:1.1;color:var(--muted)}
.checklist li.done{color:var(--muted)}
.checklist li.done::before{content:"[x]";color:var(--mint)}
.checklist li.now{color:var(--lilac);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>*{min-width:0}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.goal{margin:0;font-family:var(--f-mono);font-size:19px;line-height:1.2;color:var(--lavender);background:var(--midnight);padding:8px 10px;overflow-x:auto;white-space:pre}
.idea{font-family:var(--f-display);font-size:11px;color:var(--honey);letter-spacing:.04em}
.legend{font-family:var(--f-mono);font-size:26px;display:flex;flex-wrap:wrap;gap:4px 18px}
.legend b{color:var(--honey);font-weight:400}

#statusline{display:flex;flex-wrap:wrap;background:var(--midnight);font-family:var(--f-mono);font-size:20px;line-height:1.35}
#statusline>span{padding:0 10px;white-space:nowrap}
#sMode{background:var(--lavender);color:var(--ink)}
#sMode.ins{background:var(--mint)}
#sFile{color:var(--lilac)}
#sMsg{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0}
#sKeys{color:var(--honey)}

#kbd{display:flex;flex-direction:column;gap:4px;align-items:center;padding-top:4px;overflow-x:auto}
.krow{display:flex;gap:4px}
.key{--fc:#c8c0dc;width:var(--kw);height:var(--kw);display:grid;place-items:center;font-family:var(--f-mono);font-size:calc(var(--kw)*.55);background:color-mix(in srgb,var(--fc) 18%,var(--midnight));border-bottom:3px solid color-mix(in srgb,var(--fc) 55%,var(--ink));color:var(--lilac);position:relative;transition:transform .08s,background .08s;user-select:none}
.key.bump::after{content:"";position:absolute;bottom:18%;left:38%;right:38%;height:2px;background:currentColor;opacity:.7}
.key.wide{width:calc(var(--kw)*1.5);font-size:calc(var(--kw)*.4)}
.key.space{width:calc(var(--kw)*6 + 20px);font-size:calc(var(--kw)*.36);--fc:#c8c0dc}
.key.helper{box-shadow:inset 0 0 0 2px var(--lavender)}
.key.target{background:var(--fc);color:var(--ink);transform:translateY(-3px);animation:pulse .9s ease-in-out infinite}
.key.hit{background:var(--mint)!important;color:var(--ink)}
.key.miss{background:var(--apricot)!important;color:var(--ink)}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--fc)}}
.sp{flex:none}
.f0{--fc:#e88aa8}.f1{--fc:#f0a868}.f2{--fc:#e6d36a}.f3{--fc:#8fd694}.f4{--fc:#6cc7c0}.f5{--fc:#7fa7f0}.f6{--fc:#b294f0}.f7{--fc:#e58ae0}.f8{--fc:#c8c0dc}
#fingerHint{text-align:center;font-family:var(--f-display);font-size:11px;letter-spacing:.04em;color:var(--muted)}
#fingerHint b{color:var(--lilac);font-weight:400}
.foot{margin:0;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <div class="brand" id="brand"><b>hx</b> · <span data-t="title"></span></div>
    <div class="toggles">
      <div class="seg" role="group" aria-label="Language"><button id="lEN">EN</button><button id="lDE">DE</button></div>
      <div class="seg" role="group" aria-label="Keyboard"><button id="kZ">QWERTZ DE</button><button id="kC">QWERTZ CH</button><button id="kY">QWERTY</button><button id="kA">AZERTY</button></div>
      <button class="plain" id="sndBtn"></button>
      <button class="plain" id="menuBtn" data-t="menu"></button>
    </div>
  </header>

  <main id="stage">
    <canvas id="scene" width="960" height="576"></canvas>
    <div id="editorWrap" hidden>
      <canvas id="banner" width="960" height="168"></canvas>
      <div id="editor"></div>
    </div>
    <div id="dialog" hidden>
      <canvas id="portrait" width="48" height="48"></canvas>
      <div class="dbody"><span class="who" id="dWho"></span><span class="dtxt" id="dTxt"></span><span class="dnext" id="dNext"></span></div>
    </div>
    <div id="overlay"></div>
    <div id="toast" role="status"></div>
    <button id="focusPrompt" hidden></button>
  </main>

  <section id="panel" aria-live="polite"></section>

  <div id="statusline">
    <span id="sMode">NOR</span><span id="sFile">wonderland.txt</span><span id="sMsg"></span><span id="sKeys"></span><span id="sPos">1:1</span>
  </div>

  <div id="kbd"></div>
  <div id="fingerHint"></div>
  <p class="foot" data-t="foot"></p>
</div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const isDE = (navigator.language || 'en').toLowerCase().startsWith('de');
function guessLayout(){ const l = (navigator.language || 'en').toLowerCase();
  return l.endsWith('-ch') ? 'qwertzch' : l.startsWith('de') ? 'qwertz' : l.startsWith('fr') ? 'azerty' : 'qwerty'; }

const state = {
  lang: store.get('hiw.lang', isDE ? 'de' : 'en'),
  layout: store.get('hiw.layout', guessLayout()),
  sound: store.get('hiw.sound', true),
  prog: store.get('hiw.prog', {}),
  unlockAll: store.get('hiw.all', false),
  screen: 'title', levelIdx: 0, level: null, menuSel: 0
};
/* Home-row keys for the little fingers depend on the layout. */
const PK = () => ({ qwertz:'ö', qwertzch:'ö', qwerty:';', azerty:'m' })[state.layout] || ';';
const LPK = () => state.layout === 'azerty' ? 'q' : 'a';

/* ---------------- strings ---------------- */
const STR = {

  fingers:['left little finger','left ring finger','left middle finger','left index finger','right index finger','right middle finger','right ring finger','right little finger','thumb'],
  space:'space', nextKey:(k,f)=>`Next key: <b>${k}</b> · ${f}`,
  kbdLegend:'Each colour is one finger. Matching colours, matching finger.',
  arrows:'Arrow keys are for rabbits in a hurry. Keep your fingers home: h j k l.',
  layoutSwitched:n=>`Your keyboard looks like ${n}. Switched.`,
  langRestart:'Language changed, so this page starts over.',
  notYet:'That key belongs to a later chapter.',
  escTip:'If Esc does nothing in your browser, Ctrl+[ works too.',
  res_title:'Chapter complete!', next:'Next chapter', replay:'Play again', toMenu:'Menu',
  st_acc:'Accuracy', st_jars:'Jars caught', st_streak:'Best streak', st_keys:'Keystrokes', st_count:'Used a count', st_par:'Fewest possible',
  st_wpm:'Words per minute', st_wrong:'Wrong deletions', st_back:'Backspaces', yes:'yes', no:'not yet',
  end_title:'End of the demo', end_body:n=>`You collected ${n} of 15 tarts.`,
  end_tease:'Next in Wonderland: the Mad Tea-Party, where everyone moves one seat along at the same time. That is where Helix\'s multiple cursors come in.',

  c1_name:'Down the Rabbit Hole', c1_skill:'Home row: a s d f · j k l', c1_lesson:'Fingers live on the home row.',
  c1_i1:'Alice was getting very tired of sitting by her sister with nothing to do. Then a White Rabbit with pink eyes ran close by her.',
  c1_i2:'Oh dear! Oh dear! I shall be late!',
  c1_i3:'Down went Alice after it. The rabbit hole dipped suddenly down, like a very deep well. Jars float past the shelves as she falls.',
  c1_i4:'Catch a jar by pressing the letter on its label. First, find home: left index finger on F, right index finger on J. Can you feel the little bumps?',

  c1_st3:()=>`${LPK().toUpperCase()} and ${PK().toUpperCase()}: your little fingers.`,
  c1_st4:'All eight together. This is the home row. Your fingers live here.',

  c1_l1:'Thump! Thump! Down Alice came upon a heap of sticks and dry leaves, and the fall was over.',
  c1_l2:'Your fingers know the home row now. The keys h j k l live there too, and you will need them in the next chapter.',

  c2_name:'The Hall of Doors', c2_skill:'Helix: move with h j k l, counts', c2_lesson:'h ← j ↓ k ↑ l →, and 5j walks five steps.',
  c2_i1:'Alice found herself in a long, low hall. There were doors all round it, but they were all locked.',
  c2_i2:'Oh my ears and whiskers, how late it\'s getting!',
  c2_i3:'In Helix you move without the mouse and without the arrow keys. Your right hand already rests on the keys you need.',

  c4_name:'The Pool of Tears', c4_skill:'Helix: w e b select, d deletes, x lines, u undo', c4_lesson:'Select first, then act: w e b x, then d. u undoes.',
  c4_i1:'Alice cried so much that her tears made a pool. Now the words of her poem float in it, and the pool keeps splashing extra words in.',
  c4_i2:'I\'ll try if I know all the things I used to know. How doth the little...',
  c4_i3:'Here is the big Helix idea: first you select, then you act. Press w and Helix selects the next word. Press d and the selection is deleted.',
  c4_i4:'Clean every splash out of the poem. e selects to the end of a word, b goes back one word. Deleted the wrong thing? u undoes it.',

  junk:'splash', flood:'tears',
  c4_text:'How doth the little splash crocodile\nImprove splash his shining tail,\ntears tears tears tears tears\nAnd pour the waters of splash the Nile\nOn every golden scale! splash\n',

  c5_name:'Advice from a Caterpillar', c5_skill:'Helix: i and a insert, Esc returns', c5_lesson:'i inserts before, a after, Esc back to NOR.',
  c5_i1:'On top of a large mushroom sat a large blue Caterpillar, with its arms folded.',
  c5_i2:'Who are YOU?',
  c5_i3:'Some of the words are missing. Move to a gap and press i to start inserting. The mode in the status bar changes from NOR to INS.',
  c5_i4:'In INS every key types letters, just like the typing chapters. Press Esc to go back to NOR. a inserts after the cursor instead of before it.',
  c5_fin1:'One side will make you grow taller, and the other side will make you grow shorter.',
  c5_fin2:'And with that, the Caterpillar got down off the mushroom and crawled away into the grass.',

  c5_target:'"Who are you?" said the Caterpillar.\n"I hardly know, sir, just at present."\n"Keep your temper," said the Caterpillar.\n',
  c5_o1:'Move the cursor onto the ? and press i. NOR turns into INS.',
  c5_o2:'Type the missing word.',

/* ---------------- sound ---------------- */
let actx = null;
function beep(f=660, d=.07, type='square', vol=.045){
  if(!state.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + d + .02);
  }catch(e){}
}
const sfx = {
  ok(){ beep(880,.06); }, bad(){ beep(140,.13,'sawtooth',.035); }, step(){ beep(330,.03,'triangle',.03); },

  pick(){ beep(988,.08); setTimeout(()=>beep(1318,.12),80); },
  win(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.13),i*110)); }
};

function drawSprite(ctx, rows, pal, x, y, ps=1){
  for(let r=0;r<rows.length;r++){ const row=rows[r];
    for(let c=0;c<row.length;c++){ const ch=row[c]; if(ch==='.') continue;
      ctx.fillStyle = pal[ch]; ctx.fillRect(x+c*ps, y+r*ps, ps+.04, ps+.04); } }
}
function spriteURL(rows, pal, ps){
  const c=document.createElement('canvas'); c.width=rows[0].length*ps; c.height=rows.length*ps;
  drawSprite(c.getContext('2d'), rows, pal, 0, 0, ps); return c.toDataURL();
}

const ROWS = { qwerty:['qwertyuiop','asdfghjkl;','zxcvbnm,./'], qwertz:['qwertzuiopü','asdfghjklöä','yxcvbnm,.-'], qwertzch:['qwertzuiopü','asdfghjklöä','yxcvbnm,.-'], azerty:['azertyuiop','qsdfghjklmù','wxcvbn,;:!'] };
const COLF = [0,1,2,3,3,4,4,5,6,7,7,7];
function fingerOf(ch){
  if(ch===' ') return 8; if(ch==='esc') return 0;
  const rows = ROWS[state.layout];
  for(const r of rows){ const i=r.indexOf(ch); if(i>=0) return COLF[Math.min(i,11)]; }
  return -1;
}
const kbd = {
  el: $('#kbd'), map: {}, target: null, helpers: [],
  build(){
    const rows = ROWS[state.layout]; this.map = {};
    const key = (k, label, cls='') => `<div class="key f${fingerOf(k)} ${cls}" data-k="${k}">${label}</div>`;
    const sp = w => `<div class="sp" style="width:calc(var(--kw)*${w})"></div>`;
    let h = '<div class="krow">' + key('esc','esc','wide') + [...rows[0]].map(c=>key(c,c)).join('') + '</div>';
    h += '<div class="krow">' + sp(1.75) + [...rows[1]].map(c=>key(c,c,(c==='f'||c==='j')?'bump':'')).join('') + '</div>';
    h += '<div class="krow">' + sp(2.25) + [...rows[2]].map(c=>key(c,c)).join('') + '</div>';
    h += '<div class="krow">' + sp(1.5) + key(' ', tr('space'), 'space') + '</div>';
    this.el.innerHTML = h;
    this.el.querySelectorAll('.key').forEach(k => this.map[k.dataset.k] = k);
    const t = this.target; this.target = null; this.setTarget(t); this.setHelpers(this.helpers);
  },
  setTarget(ch){
    if(ch === this.target) return;
    if(this.target && this.map[this.target]) this.map[this.target].classList.remove('target');
    this.target = ch;
    if(ch && this.map[ch]) this.map[ch].classList.add('target');
    const fh = $('#fingerHint');
    if(ch){ const f = fingerOf(ch); fh.innerHTML = tr('nextKey', ch===' ' ? tr('space') : ch, f>=0 ? tr('fingers')[f] : ''); }
    else fh.textContent = tr('kbdLegend');
  },
  setHelpers(list){
    this.helpers = list;
    Object.entries(this.map).forEach(([k,el]) => el.classList.toggle('helper', list.includes(k)));
  },
  flash(ch, ok){
    const el = this.map[ch === 'Escape' ? 'esc' : ch]; if(!el) return;
    el.classList.remove('hit','miss'); void el.offsetWidth; el.classList.add(ok?'hit':'miss');
    setTimeout(()=>el.classList.remove('hit','miss'), 170);
  }
};

  for(let i=0;i<26;i++){ const x = 62 + hash(i+7)%196; const y = (((hash(i*13)%400) - scroll*1.7) % 220 + 440) % 220 - 14; ctx.fillRect(x,y,1,6); }
  for(const side of [0,1]){
    const x0 = side ? 260 : 0;
    ctx.fillStyle='#43295a'; ctx.fillRect(x0,0,60,192);
    ctx.fillStyle='#382149'; const off = scroll % 8;
    for(let y=-off; y<192; y+=8){ ctx.fillRect(x0,y,60,1); const row = Math.round((y+scroll)/8); const sh = (row%2) ? 0 : 8; for(let x=sh;x<60;x+=16) ctx.fillRect(x0+x,y,1,8); }
    const seg = 56, k0 = Math.floor(scroll/seg) - 1;
    for(let k=k0;k<k0+6;k++) drawDecor(ctx, hash(k*2+side)%5, x0 + (side?14:10), k*seg - scroll + 8);
    ctx.fillStyle='#2a1838'; ctx.fillRect(side?260:56,0,4,192);
  }
}
function drawJar(ctx, j, isTarget){

class FallLevel {
  constructor(idle=false){ this.idle = idle; this.scroll = 0; this.t = 0; this.jars = []; this.fly = []; this.running = false; this.wob = 0; }
  stages(){ const P = PK(), L = LPK(); return [['f','j'],['d','k'],['s','l'],[L,P],['f','j','d','k','s','l',L,P],['g','h']]; }
  enter(){
    showScene(); setMode('INS'); kbd.setHelpers([]); kbd.setTarget(null);
    Object.assign(this, { si:0, need:[6,6,6,6,10,6], caught:0, hits:0, errs:0, misses:0, streak:0, best:0, spawnT:.4, running:false, last:'' });
    setStatus({msg:'', keys:'', pos:'0/40'});
    dialog([['narrator','c1_i1'],['rabbit','c1_i2'],['narrator','c1_i3'],['narrator','c1_i4']], ()=>{ this.running = true; toast(tr('c1_st0')); });
    this.panel();
  }
  onLang(){ this.panel(); }
  onLayout(){ const P = PK(), L = LPK(); this.jars.forEach(j=>{ if(';öm'.includes(j.ch)) j.ch = P; if('aq'.includes(j.ch)) j.ch = L; }); this.panel(); }
  target(){ let best=null; for(const j of this.jars) if(!j.got && (!best || j.y < best.y)) best = j; return best; }
  panel(){
    if(this.idle) return;
    const st = this.stages(), n = st.length, total = this.need.reduce((a,b)=>a+b,0);
    const done = this.need.slice(0,this.si).reduce((a,b)=>a+b,0) + this.caught;
    const acc = this.hits+this.errs ? Math.round(100*this.hits/(this.hits+this.errs)) : 100;
    panel(`<span class="ptag">${tr('c1_stage', Math.min(this.si+1,n), n)} · ${st[Math.min(this.si,n-1)].map(c=>c.toUpperCase()).join(' ')}</span>
      <p class="big">${tr('c1_st'+Math.min(this.si,n-1))}</p>
      <div class="meter"><i style="width:${100*done/total}%"></i></div>
      <div class="stats"><span>${tr('st_jars')}<b>${done}/${total}</b></span><span>${tr('st_acc')}<b>${acc}%</b></span><span>${tr('st_streak')}<b>${this.streak}</b></span></div>`);
    setStatus({pos:`${done}/${total}`});
  }
  spawn(){
    const set = this.stages()[this.si]; let ch;
    do { ch = set[Math.floor(Math.random()*set.length)]; } while(set.length>1 && ch===this.last && Math.random()<.6);
    this.last = ch;
    this.jars.push({ x: 72 + Math.random()*150, y: 196, ch, v: 13 + this.si*1.3 + Math.random()*3, got:false });
  }
  tick(dt){
    this.t += dt; this.scroll += dt*(this.idle ? 26 : 42);
    if(this.wob > 0) this.wob -= dt;
    for(const f of this.fly){ f.t += dt; }
    this.fly = this.fly.filter(f => f.t < .35);
    if(!this.running || dlg.open) return;
    const live = this.jars.filter(j=>!j.got).length;
    this.spawnT -= dt;
    if(this.spawnT <= 0 && live < 3 && this.caught + live < this.need[this.si]){ this.spawn(); this.spawnT = Math.max(1.3, 2.5 - this.si*.18); }
    for(const j of this.jars) j.y -= j.v*dt;
    const before = this.jars.length;
    this.jars = this.jars.filter(j => { if(j.y < -24){ this.misses++; this.streak = 0; return false; } return true; });
    if(this.jars.length !== before) this.panel();
    const tg = this.target(); kbd.setTarget(tg ? tg.ch : null);
  }
  key(e){
    if(!this.running) return;
    const k = e.key.toLowerCase(); if(k.length !== 1 || k === ' ') return;
    e.preventDefault();
    let cand = null; for(const j of this.jars) if(!j.got && j.ch===k && (!cand || j.y < cand.y)) cand = j;
    if(cand){
      cand.got = true; this.jars = this.jars.filter(j=>j!==cand); this.fly.push({x:cand.x,y:cand.y,ch:cand.ch,t:0});
      this.hits++; this.streak++; this.best = Math.max(this.best,this.streak); this.caught++; sfx.ok(); kbd.flash(k,true);
      if(this.caught >= this.need[this.si]){
        this.si++; this.caught = 0; this.jars = [];
        if(this.si >= this.stages().length){ this.finish(); return; }
        sfx.pick(); toast(tr('c1_st'+this.si)); this.spawnT = .8;
      }
    } else { this.errs++; this.streak = 0; this.wob = .35; sfx.bad(); kbd.flash(k,false); }
    this.panel();
  }
  finish(){
    this.running = false; kbd.setTarget(null); this.panel();
    const acc = this.hits/(this.hits+this.errs||1);
    const tarts = acc >= .95 ? 3 : acc >= .85 ? 2 : 1;
    dialog([['narrator','c1_l1'],['narrator','c1_l2']], ()=>finishLevel(tarts, [['st_acc', Math.round(acc*100)+'%'],['st_jars', this.hits],['st_streak', this.best]]));
  }
  draw(){
    prep(sctx); drawWell(sctx, this.scroll);
    const tg = this.target();
    for(const j of this.jars) drawJar(sctx, j, j===tg);
    for(const f of this.fly){ const p = f.t/.35; drawJar(sctx, {x: f.x + (148-f.x)*p, y: f.y + (40-f.y)*p, ch:f.ch}, false); }
    const wx = this.wob > 0 ? Math.sin(this.t*70)*2 : 0;
    drawSprite(sctx, ALICE_FALL, ALICE_PAL, 148 + wx, 30 + Math.sin(this.t*2.2)*3, 2);
    if(this.idle){ drawSprite(sctx, RABBIT, RABBIT_PAL, 210 + Math.sin(this.t)*10, 120 + Math.sin(this.t*1.3)*6, 1); }
  }
}

/* =============== CHAPTER 2: hall, h j k l =============== */
const HALL = [
"####D####D####D#####",
"#..................#",
"#..PP..........PP..#",
"#..PP...TTT....PP..#",
"#.......TTT........#",
"#........K.........#",
"#..................#",
"D....PP......PP....D",
"#....PP......PP....#",
"#..................#",
"#S................c#",
"#####D#######D####C#"];
const WALK = new Set(['.','S','K','c']);
function drawTile(ctx, ch, x, y, gx, gy){
  const X = x*16, Y = y*16;
  const floor = () => { ctx.fillStyle = (gx+gy)%2 ? '#33223f' : '#3c2a4b'; ctx.fillRect(X,Y,16,16); ctx.fillStyle='rgba(219,191,239,.04)'; ctx.fillRect(X,Y,16,1); };
  const wall = () => { ctx.fillStyle='#5a3d73'; ctx.fillRect(X,Y,16,16); ctx.fillStyle='#4a3060'; ctx.fillRect(X,Y+5,16,1); ctx.fillRect(X,Y+11,16,1); ctx.fillRect(X+(gy%2?4:10),Y,1,5); ctx.fillRect(X+(gy%2?10:4),Y+6,1,5); ctx.fillRect(X+7,Y+12,1,4); };
  if(ch==='#') wall();
  else if(ch==='D'){ wall(); ctx.fillStyle='#8a5a3c'; ctx.fillRect(X+3,Y+3,10,13); ctx.fillRect(X+4,Y+2,8,1); ctx.fillStyle='#6b3f2a'; ctx.fillRect(X+7,Y+4,1,12); ctx.fillStyle='#efba5d'; ctx.fillRect(X+10,Y+9,2,2); }
  else if(ch==='C'){ wall(); ctx.fillStyle='#b8435a'; ctx.fillRect(X+2,Y+1,12,15); ctx.fillStyle='#8e2f45'; ctx.fillRect(X+5,Y+1,1,15); ctx.fillRect(X+10,Y+1,1,15); ctx.fillStyle='#efba5d'; ctx.fillRect(X+2,Y+1,12,1); }
  else if(ch==='T'){ floor(); ctx.fillStyle='rgba(191,230,240,.38)'; ctx.fillRect(X,Y+2,16,12); ctx.fillStyle='#bfe6f0'; ctx.fillRect(X,Y+2,16,1); ctx.fillStyle='rgba(191,230,240,.6)'; ctx.fillRect(X+2,Y+4,3,1); }
  else if(ch==='P'){ floor(); ctx.fillStyle='#8c7fa8'; ctx.fillRect(X+2,Y,12,16); ctx.fillStyle='#6d6088'; ctx.fillRect(X+10,Y,4,16); ctx.fillStyle='#b3a7cc'; ctx.fillRect(X+3,Y,2,16); }
  else floor();
}
class HallLevel {
  enter(){
    showScene(); setMode('NOR'); kbd.setHelpers(['h','j','k','l']); kbd.setTarget(null);
    this.map = HALL.map(r=>r.split(''));
    for(let y=0;y<12;y++) for(let x=0;x<20;x++) if(this.map[y][x]==='S'){ this.px=x; this.py=y; }
    Object.assign(this, { dx:this.px*16, dy:this.py*16, q:[], count:'', keys:0, usedCount:false, moves:0, gotKey:false, done:false, ready:false, mv:null, t:0, shake:0,
      rabbit:{x:12*16,y:16,path:[[13,1],[14,1],[14,0]],gone:false,run:false} });
    setStatus({msg:'', keys:'', pos:`${this.py+1}:${this.px+1}`});
    dialog([['narrator','c2_i1'],['rabbit','c2_i2'],['narrator','c2_i3'],['narrator','c2_i4']], ()=>{ this.ready = true; this.rabbit.run = true; });
    this.panel();
  }
  onLang(){ this.panel(); }
  panel(){
    panel(`<div class="legend"><span><b>h</b> ←</span><span><b>j</b> ↓</span><span><b>k</b> ↑</span><span><b>l</b> →</span></div>
      <p class="big">${this.gotKey ? tr('c2_obj2') : tr('c2_obj1')}</p>
      <p>${this.gotKey ? tr('c2_countTip') : ''}</p>${this.gotKey && state.layout==='azerty' ? `<p>${tr('c2_azerty')}</p>` : ''}
      <div class="stats"><span>${tr('st_keys')}<b>${this.keys}</b></span><span>${tr('st_count')}<b>${this.usedCount?tr('yes'):tr('no')}</b></span></div>`);
  }
  walkable(x,y){ return y>=0 && y<12 && x>=0 && x<20 && WALK.has(this.map[y][x]); }
  key(e){
    if(!this.ready || this.done) return;
    const k = e.key;
    if(k.startsWith('Arrow')){ e.preventDefault(); toast(tr('arrows')); sfx.bad(); return; }
    if(/^[0-9]$/.test(k) && !(k==='0' && !this.count)){ e.preventDefault(); this.count += k; this.keys++; setStatus({keys:this.count}); sfx.tick(); this.panel(); return; }
    if(k==='Escape'){ this.count=''; setStatus({keys:''}); return; }
    const dir = {h:[-1,0], j:[0,1], k:[0,-1], l:[1,0]}[k];
    if(!dir){ if(k.length===1){ e.preventDefault(); kbd.flash(k.toLowerCase(), false); } return; }
    e.preventDefault(); this.keys++;
    const n = this.count ? Math.min(30, parseInt(this.count,10)) : 1;
    if(n > 1) this.usedCount = true;
    this.count = ''; setStatus({keys:''}); kbd.flash(k, true);
    for(let i=0;i<n;i++) this.q.push(dir);
    this.panel();
  }
  tick(dt){
    this.t += dt; if(this.shake>0) this.shake -= dt;
    const r = this.rabbit;
    if(r.run && !r.gone){ const [tx,ty] = r.path[0]; const sx = Math.sign(tx*16-r.x), sy = Math.sign(ty*16-r.y);
      r.x += sx*dt*70; r.y += sy*dt*70;
      if((sx>0 && r.x>=tx*16)||(sx<0 && r.x<=tx*16)||(sy<0 && r.y<=ty*16)||(sx===0&&sy===0)){ r.x=tx*16; r.y=ty*16; r.path.shift(); if(!r.path.length) r.gone = true; } }
    if(this.mv){
      this.mv.t += dt/.075; const p = Math.min(1, this.mv.t);
      this.dx = (this.mv.fx + (this.px*16 - this.mv.fx)*p); this.dy = (this.mv.fy + (this.py*16 - this.mv.fy)*p);
      if(p >= 1){ this.mv = null; this.arrive(); }
      return;
    }
    if(this.q.length && !dlg.open){
      const [ddx,ddy] = this.q.shift(); const nx = this.px+ddx, ny = this.py+ddy;
      if(!this.walkable(nx,ny)){ this.q = []; sfx.bump(); this.shake = .15; return; }
      this.mv = { fx:this.px*16, fy:this.py*16, t:0 }; this.px = nx; this.py = ny; this.moves++; sfx.step();
      setStatus({pos:`${this.py+1}:${this.px+1}`});
    }
  }
  arrive(){
    const ch = this.map[this.py][this.px];
    if(ch==='K' && !this.gotKey){ this.gotKey = true; this.q = []; this.map[this.py][this.px] = '.'; sfx.pick(); this.panel();
      dialog([['alice','c2_k1'],['narrator','c2_k2']]); }
    else if(ch==='c' && !this.q.length){
      if(!this.gotKey){ toast(tr('c2_locked')); return; }
      this.done = true; this.q = [];
      const tarts = 1 + (this.usedCount?1:0) + (this.keys<=20?1:0);
      dialog([['narrator','c2_fin']], ()=>finishLevel(tarts, [['st_keys', this.keys],['st_par', 8],['st_count', this.usedCount?tr('yes'):tr('no')]]));
    }
  }
  draw(){
    prep(sctx); const ctx = sctx;
    for(let y=0;y<12;y++) for(let x=0;x<20;x++) drawTile(ctx, this.map[y][x], x, y, x, y);
    if(this.map[5][9]==='K'){ drawSprite(ctx, KEY_SPR, {y:'#efba5d'}, 9*16+3, 5*16+7, 1); if(Math.floor(this.t*3)%2){ ctx.fillStyle='#fff'; ctx.fillRect(9*16+12,5*16+4,1,1); } }
    if(!this.rabbit.gone) drawSprite(ctx, RABBIT, RABBIT_PAL, this.rabbit.x+2, this.rabbit.y, 1);
    const sx = this.shake>0 ? Math.sin(this.t*90) : 0;
    drawSprite(ctx, this.moves%2 ? ALICE_B : ALICE_A, ALICE_PAL, this.dx+2+sx, this.dy, 1);
    if(this.ready && this.moves < 14 && !this.mv){
      for(const [c,ox,oy] of [['h',-1,0],['j',0,1],['k',0,-1],['l',1,0]]){
        const tx = this.px+ox, ty = this.py+oy; if(!this.walkable(tx,ty)) continue;
        const X = tx*16+3, Y = ty*16+3;
        ctx.fillStyle='#120a18'; ctx.fillRect(X,Y+1,10,10); ctx.fillStyle='#dbbfef'; ctx.fillRect(X,Y,10,9);
        txt(ctx, c, X+5, Y-2, 12, 'VT323', '#120a18');
      }
    }
    if(this.count){ const X = this.dx+2, Y = this.dy-12; ctx.fillStyle='#efba5d'; ctx.fillRect(X-2,Y,16,10); txt(ctx, this.count, X+6, Y-2, 12, 'VT323', '#120a18'); }
  }
}

/* =============== CHAPTER 3: Drink Me, typing words =============== */
class DrinkLevel {
  enter(){
    showScene(); setMode('INS'); kbd.setHelpers([]);
    Object.assign(this, { words: tr('c3_words'), wi:0, ci:0, wait:false, errs:0, ok:0, start:0, err:false, ps:6, ready:false, t:0, walk:-1, done:false });
    setStatus({msg:'', keys:'', pos:'0/12'});
    dialog([['narrator','c3_i1'],['narrator','c3_i2'],['narrator','c3_i3']], ()=>{ this.ready = true; toast(tr('c3_new')); this.upd(); });
    kbd.setTarget(null); this.panel();
  }
  onLang(){ if(!this.start && !this.done){ this.words = tr('c3_words'); } this.panel(); }
  expected(){ return this.wait ? ' ' : this.words[this.wi][this.ci]; }
  upd(){ kbd.setTarget(this.done ? null : this.expected()); this.panel(); setStatus({pos:`${this.wi}/${this.words.length}`}); }
  panel(){
    const ws = this.words; let h = '<div class="words">';
    for(let i=Math.max(0,this.wi-2); i<Math.min(ws.length, this.wi+4); i++){
      const w = ws[i];
      if(i < this.wi) h += `<span class="word done">${w}</span>`;
      else if(i === this.wi) h += '<span class="word now">' + [...w].map((c,j)=>`<span class="${j<this.ci?'ok':(j===this.ci&&!this.wait?'cur'+(this.err?' err':''):'')}">${c}</span>`).join('') + (this.wait?`<span class="cur${this.err?' err':''}">&nbsp;</span>`:'') + '</span>';
      else h += `<span class="word next">${w}</span>`;
    }
    h += '</div>';
    const acc = this.ok+this.errs ? Math.round(100*this.ok/(this.ok+this.errs)) : 100;
    h += `<div class="stats"><span>${tr('c3_sips')}<b>${this.wi}/${ws.length}</b></span><span>${tr('st_acc')}<b>${acc}%</b></span><span>${tr('st_wpm')}<b>${this.wpm()}</b></span></div>`;
    panel(h);
  }
  wpm(){ if(!this.start) return 0; const m = (performance.now()-this.start)/60000; return m > .05 ? Math.round(this.ok/5/m) : 0; }
  key(e){
    if(!this.ready || this.done) return;
    const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
    if(k.length !== 1) return;
    e.preventDefault();
    if(!this.start) this.start = performance.now();
    if(k === this.expected()){
      this.ok++; this.err = false; kbd.flash(k, true);
      if(this.wait){ this.wait=false; this.wi++; this.ci=0; sfx.ok();
        if(this.wi >= this.words.length){ this.finish(); return; } }
      else { this.ci++; sfx.tick(); if(this.ci >= this.words[this.wi].length) this.wait = true; }
    } else { this.errs++; this.err = true; sfx.bad(); kbd.flash(k, false); }
    this.upd();
  }
  finish(){
    this.done = true; kbd.setTarget(null); this.panel(); this.walk = 0;
    const acc = this.ok/(this.ok+this.errs||1), wpm = this.wpm();
    setTimeout(()=>dialog([['narrator','c3_fin']], ()=>finishLevel(acc>=.95?3:acc>=.85?2:1, [['st_acc',Math.round(acc*100)+'%'],['st_wpm',wpm]])), 1500);
  }
  tick(dt){
    this.t += dt;

    this.ps += (target - this.ps)*Math.min(1, dt*4);

  draw(){

    c.fillStyle='#5a3d73'; c.fillRect(0,138,320,12);
    for(let x=0;x<20;x++) for(let y=0;y<3;y++){ c.fillStyle=(x+y)%2?'#33223f':'#3c2a4b'; c.fillRect(x*16,150+y*16,16,16); }
    c.fillStyle='#b8435a'; c.fillRect(272,112,22,38); c.fillStyle='#8a5a3c'; c.fillRect(278,126,12,24); c.fillStyle='#efba5d'; c.fillRect(287,138,2,2);
    c.fillStyle='rgba(191,230,240,.35)'; c.fillRect(30,108,70,4); c.fillStyle='#bfe6f0'; c.fillRect(30,108,70,1);
    c.fillStyle='rgba(191,230,240,.45)'; c.fillRect(34,112,2,38); c.fillRect(94,112,2,38);
    c.fillStyle='#8a5a3c'; c.fillRect(62,86,6,3);
    c.fillStyle='rgba(164,160,232,.7)'; c.fillRect(63,89,4,4); c.fillRect(59,93,12,15);
    c.fillStyle='#f4ead2'; c.fillRect(60,97,10,6);
    c.fillStyle='#dbbfef'; c.fillRect(65,74,1,12);
    const lab = tr('bottle'); c.font='8px Silkscreen, monospace'; const w = c.measureText(lab).width + 8;
    c.fillStyle='#f4ead2'; c.fillRect(65-w/2,62,w,12); c.fillStyle='#120a18'; c.fillRect(65-w/2,73,w,1);
    txt(c, lab, 65, 64, 8, 'Silkscreen', '#120a18');
    const ps = this.ps, h = 16*ps, wd = 12*ps;
    const x = 150 + (this.walk>0 ? (283 - 150 - wd/2)*this.walk : 0) - (this.walk>0?0:wd/2);
    drawSprite(c, (this.walk>0 && Math.floor(this.t*8)%2) ? ALICE_B : ALICE_A, ALICE_PAL, x, 150-h, ps);
  }
}

/* =============== Editor (Helix subset) =============== */
const wordRe = /[\p{L}\p{N}_]/u;
const cls = ch => ch==='\n' ? 'nl' : (ch===' '||ch==='\t') ? 'sp' : wordRe.test(ch) ? 'w' : 'p';
const escH = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
class Editor {
  constructor(el, text, allowed, onEv){ Object.assign(this, { el, text, allowed:new Set(allowed), onEv, a:0, h:0, mode:'NOR', ins:0, hist:[], goal:0, last:[] }); this.render(); }
  ls(i){ return this.text.lastIndexOf('\n', i-1) + 1; }
  le(i){ return this.text.indexOf('\n', i); }
  save(){ this.hist.push({text:this.text, a:this.a, h:this.h}); if(this.hist.length>100) this.hist.shift(); }
  setGoal(){ this.goal = this.h - this.ls(this.h); }
  key(e){
    const k = e.key;
    if(this.mode === 'INS') return this.insKey(e);
    if(!this.allowed.has(k)){ if(k.length===1){ this.onEv('blocked', k); return true; } return false; }
    const T = this.text, n = T.length, lo = Math.min(this.a,this.h), hi = Math.max(this.a,this.h);
    switch(k){
      case 'h': if(this.h > this.ls(this.h)) this.h--; this.a = this.h; this.setGoal(); this.onEv('move'); break;
      case 'l': if(T[this.h] !== '\n') this.h++; this.a = this.h; this.setGoal(); this.onEv('move'); break;
      case 'j': { const e2 = this.le(this.h); if(e2+1 < n){ const ns = e2+1; this.h = Math.min(ns+this.goal, this.le(ns)); } this.a = this.h; this.onEv('move'); break; }
      case 'k': { const s = this.ls(this.h); if(s > 0){ const ps = this.ls(s-1); this.h = Math.min(ps+this.goal, s-1); } this.a = this.h; this.onEv('move'); break; }
      case 'w': this.wordNext(); this.setGoal(); this.onEv('select', k); break;
      case 'e': this.wordEnd(); this.setGoal(); this.onEv('select', k); break;
      case 'b': this.wordBack(); this.setGoal(); this.onEv('select', k); break;
      case 'x': { const s = this.ls(lo), en = this.le(hi);
        if(lo===s && hi===en && hi+1<n){ this.a = s; this.h = this.le(hi+1); } else { this.a = s; this.h = en; }
        this.onEv('select', k); break; }
      case 'd': case 'c': {
        this.save(); const del = T.slice(lo, hi+1);
        let nt = T.slice(0,lo) + T.slice(hi+1); if(!nt.endsWith('\n')) nt += '\n';
        this.text = nt; this.a = this.h = Math.min(lo, nt.length-1);
        this.onEv('delete', del);
        if(k==='c'){ this.mode='INS'; this.ins = lo; this.onEv('insert'); }
        break; }
      case 'u': { const s = this.hist.pop(); if(s){ Object.assign(this, s); this.onEv('undo'); } break; }
      case 'i': this.save(); this.mode='INS'; this.ins = lo; this.onEv('insert'); break;
      case 'a': this.save(); this.mode='INS'; this.ins = T[hi]==='\n' ? hi : hi+1; this.onEv('insert'); break;
      case 'Escape': this.a = this.h; break;
    }
    this.last.push(k==='Escape'?'esc':k); this.last = this.last.slice(-5);
    this.render(); return true;
  }
  insKey(e){
    const k = e.key; const T = this.text;
    if(k === 'Escape'){ this.mode = 'NOR'; const s = this.ls(this.ins); this.a = this.h = Math.max(s, this.ins-1); this.setGoal(); this.last.push('esc'); this.onEv('esc'); }
    else if(k === 'Backspace'){ if(this.ins > 0){ this.text = T.slice(0,this.ins-1) + T.slice(this.ins); this.ins--; } this.onEv('back'); }
    else if(k === 'Enter'){ this.text = T.slice(0,this.ins) + '\n' + T.slice(this.ins); this.ins++; this.onEv('type','\n'); }
    else if(k.length === 1){ this.text = T.slice(0,this.ins) + k + T.slice(this.ins); this.ins++; this.onEv('type', k); }
    else return false;
    this.render(); return true;
  }
  wordNext(){
    const T = this.text, n = T.length; let s = this.h;
    if(T[s] === '\n'){ s++; if(s >= n) return; }
    else if(s+1 < n && cls(T[s]) !== cls(T[s+1])) s++;
    if(T[s] === '\n'){ s++; if(s >= n) return; }
    let i = s; const c = cls(T[i]);
    if(c !== 'sp') while(i < n && cls(T[i]) === c) i++;
    while(i < n && cls(T[i]) === 'sp') i++;
    this.a = s; this.h = Math.max(s, i-1);
  }
  wordEnd(){
    const T = this.text, n = T.length; let s = this.h;
    if(s+1 < n && cls(T[s]) !== cls(T[s+1])) s++;
    let i = s, crossed = false;
    while(i < n && (cls(T[i])==='sp' || cls(T[i])==='nl')){ if(T[i]==='\n') crossed = true; i++; }
    if(i >= n) return;
    const c = cls(T[i]); let ws = i;
    while(i+1 < n && cls(T[i+1]) === c) i++;
    this.a = crossed ? ws : s; this.h = i;
  }
  wordBack(){
    const T = this.text; let s = this.h;
    if(s-1 >= 0 && cls(T[s]) !== cls(T[s-1])) s--;
    let i = s, crossed = false;
    while(i >= 0 && (cls(T[i])==='sp' || cls(T[i])==='nl')){ if(T[i]==='\n') crossed = true; i--; }
    if(i < 0) return;
    const c = cls(T[i]); const we = i;
    while(i-1 >= 0 && cls(T[i-1]) === c) i--;
    this.a = crossed ? we : s; this.h = i;
  }
  pos(){ const p = this.mode==='INS' ? this.ins : this.h; const line = this.text.slice(0,p).split('\n').length; return `${line}:${p - this.ls(p) + 1}`; }
  render(){
    const T = this.text, lo = Math.min(this.a,this.h), hi = Math.max(this.a,this.h);
    const fp = this.mode==='INS' ? this.ins : this.h, fl = T.slice(0,fp).split('\n').length - 1;
    let out = '', line = '', ln = 0;
    for(let i=0;i<T.length;i++){
      const ch = T[i]; const c = [];
      if(this.mode === 'NOR'){ if(i>=lo && i<=hi) c.push('sel'); if(i===this.h) c.push('cur'); }
      else if(i === this.ins) c.push('bar');
      const d = ch==='\n' ? ' ' : escH(ch);
      line += c.length ? `<span class="${c.join(' ')}">${d}</span>` : d;
      if(ch === '\n'){ out += `<div class="ln${ln===fl?' on':''}"><span class="gut">${ln+1}</span><span class="code">${line}</span></div>`; line=''; ln++; }
    }
    this.el.innerHTML = out;
  }
}
const norm = s => s.split('\n').map(l=>l.trim().replace(/\s+/g,' ')).filter(Boolean).join('\n');

class EditorLevel {
  enter(){
    showEditor(); kbd.setTarget(null); kbd.setHelpers(this.helpers);
    this.ed = new Editor($('#editor'), this.startText(), this.allowed, (ev,d)=>this.onEv(ev,d));
    Object.assign(this, { done:false, ready:false, obj:{}, keys:0, t:0, lastBlock:0 });
    this.init && this.init();
    setMode('NOR'); setStatus({msg:'', keys:'', pos:this.ed.pos()});
    dialog(this.intro, ()=>{ this.ready = true; this.panel(); });
    this.panel();
  }
  onLang(){ toast(tr('langRestart')); this.enter(); }
  key(e){
    if(!this.ready || this.done) return;
    if(this.ed.key(e)){
      e.preventDefault(); this.keys++;
      if(e.key.length===1 && this.ed.mode==='NOR') kbd.flash(e.key, this.ed.allowed.has(e.key));
      setMode(this.ed.mode); setStatus({pos:this.ed.pos(), keys:this.ed.mode==='NOR' ? this.ed.last.join(' ') : ''});
      this.check(); this.panel();
    }
  }
  blocked(){ const now = performance.now(); if(now - this.lastBlock > 2500){ toast(tr('notYet')); this.lastBlock = now; } sfx.bad(); }
  checklist(items){ let firstOpen = true; return '<ul class="checklist">' + items.map(([done,label])=>{ const cl = done ? 'done' : (firstOpen ? (firstOpen=false,'now') : ''); return `<li class="${cl}">${label}</li>`; }).join('') + '</ul>'; }
  draw(){ prep(bctx); this.drawBanner(bctx); }
  tick(dt){ this.t += dt; }
}

/* =============== CHAPTER 4: Pool of Tears =============== */
class PoolLevel extends EditorLevel {
  constructor(){ super();
    this.helpers = ['h','j','k','l','w','e','b','d','x','u'];
    this.allowed = ['h','j','k','l','w','e','b','d','x','u','Escape'];
    this.intro = [['narrator','c4_i1'],['alice','c4_i2'],['narrator','c4_i3'],['narrator','c4_i4']];
  }
  startText(){ return tr('c4_text'); }
  init(){ this.wrong = 0; this.junk = tr('junk'); this.flood = tr('flood'); }
  wordsIn(s){ return s.split(/\s+/).map(w=>w.replace(/[^\p{L}]/gu,'')).filter(Boolean); }
  junkLeft(){ return this.wordsIn(this.ed.text).filter(w=>w===this.junk).length; }
  atJunk(){ const T = this.ed.text; let s = this.ed.h, e = this.ed.h; if(cls(T[s])!=='w') return false;
    while(s>0 && cls(T[s-1])==='w') s--; while(e+1<T.length && cls(T[e+1])==='w') e++; return T.slice(s,e+1)===this.junk; }
  onEv(ev, d){
    if(ev==='blocked') return this.blocked();
    if((ev==='move'||ev==='select') && this.atJunk()) this.obj.o1 = true;
    if(ev==='select'){ this.obj.o1 = this.obj.o1 || this.wordsIn(this.ed.text.slice(Math.min(this.ed.a,this.ed.h), Math.max(this.ed.a,this.ed.h)+1)).includes(this.junk); this.obj.o2 = true; sfx.tick(); }
    if(ev==='delete'){
      const ws = this.wordsIn(d);
      if(ws.length && ws.every(w=>w===this.junk||w===this.flood)){ if(ws.includes(this.junk)) this.obj.o3 = true; sfx.ok(); }
      else if(ws.length){ this.wrong++; toast(tr('c4_wrong')); sfx.bad(); }
    }
    if(ev==='undo') sfx.step();
  }
  check(){
    if(norm(this.ed.text) === norm(tr('c4_target'))){
      this.done = true; sfx.win();
      const tarts = this.wrong===0 ? 3 : this.wrong<=2 ? 2 : 1;
      setTimeout(()=>dialog([['narrator','c4_fin']], ()=>finishLevel(tarts, [['st_keys',this.keys],['st_wrong',this.wrong]])), 500);
    }
  }
  panel(){
    if(!this.ed) return;
    const left = this.junkLeft(), floodGone = !this.ed.text.includes(this.flood);
    panel(`<span class="idea">${tr('c4_idea')}</span><div class="cols"><div>${this.checklist([
      [this.obj.o1, tr('c4_o1')],[this.obj.o2, tr('c4_o2')],[this.obj.o3, tr('c4_o3')],[left===0, tr('c4_o4', left)],[floodGone, tr('c4_o5')]
    ])}<p class="ptag" style="margin-top:6px">${tr('c4_tip')}</p></div>
    <div><span class="ptag">${tr('c4_goal')}</span><pre class="goal">${escH(tr('c4_target'))}</pre></div></div>`);
  }
  drawBanner(c){
    c.fillStyle='#1f3550'; c.fillRect(0,0,320,56);
    for(let r=0;r<5;r++){ c.fillStyle = r%2 ? '#2a4a6e' : '#25405f'; for(let x=0;x<320;x+=2){ const y = 8 + r*10 + Math.sin(x/14 + this.t*1.6 + r)*2; c.fillRect(x, y, 2, 1); } }
    const by = 20 + Math.sin(this.t*2)*2;
    drawSprite(c, ALICE_TOP, ALICE_PAL, 120, by, 2);
    c.fillStyle='#6fa8dc'; c.fillRect(120, by+14, 24, 2);
    drawSprite(c, MOUSE, MOUSE_PAL, 200 + Math.sin(this.t*.8)*16, 30 + Math.sin(this.t*2.4)*1.5, 2);
    c.fillStyle='rgba(219,191,239,.5)'; for(let i=0;i<8;i++){ const x = (hash(i)%300) + 10, y = 6 + ((hash(i+50)%40) + this.t*6*(1+i%3)) % 46; c.fillRect(x, y, 1, 2); }
  }
}

/* =============== CHAPTER 5: Caterpillar =============== */
class CatLevel extends EditorLevel {
  constructor(){ super();
    this.helpers = ['h','j','k','l','w','e','b','d','x','u','i','a','c','esc'];
    this.allowed = ['h','j','k','l','w','e','b','d','x','u','i','a','c','Escape'];
    this.intro = [['narrator','c5_i1'],['cat','c5_i2'],['narrator','c5_i3'],['narrator','c5_i4']];
  }
  startText(){ return tr('c5_text'); }
  init(){ this.backs = 0; this.typedSince = false; this.escTipShown = false; }
  filled(){ const a = norm(this.ed.text).split('\n'), b = norm(tr('c5_target')).split('\n'); return b.filter((l,i)=>a[i]===l).length; }
  onEv(ev, d){
    if(ev==='blocked') return this.blocked();
    if(ev==='insert'){ this.obj.o1 = true; this.typedSince = false; sfx.tick(); setMode('INS');
      if(!this.escTipShown){ this.escTipShown = true; setTimeout(()=>toast(tr('escTip'), 4200), 1200); } }
    if(ev==='type'){ if(this.obj.o1){ this.obj.o2 = true; this.typedSince = true; } sfx.tick(); }
    if(ev==='back'){ this.backs++; sfx.step(); }
    if(ev==='esc'){ if(this.typedSince) this.obj.o3 = true; sfx.ok(); }
    if(ev==='delete') sfx.step();
  }
  check(){
    if(this.ed.mode==='NOR' && norm(this.ed.text) === norm(tr('c5_target'))){
      this.done = true; sfx.win();
      const tarts = this.backs<=3 ? 3 : this.backs<=8 ? 2 : 1;
      setTimeout(()=>dialog([['cat','c5_fin1'],['narrator','c5_fin2']], ()=>finishLevel(tarts, [['st_keys',this.keys],['st_back',this.backs]])), 500);
    }
  }
  panel(){
    if(!this.ed) return;
    const f = this.filled();
    panel(`<div class="cols"><div>${this.checklist([
      [this.obj.o1, tr('c5_o1')],[this.obj.o2, tr('c5_o2')],[this.obj.o3, tr('c5_o3')],[f===3 && this.ed.mode==='NOR', tr('c5_o4', f)]
    ])}<p class="ptag" style="margin-top:6px">${tr('c5_tip')}</p></div>
    <div><span class="ptag">${tr('c5_goal')}</span><pre class="goal">${escH(tr('c5_target'))}</pre></div></div>`);
  }
  drawBanner(c){
    c.fillStyle='#2d1f45'; c.fillRect(0,0,320,56);
    c.fillStyle='#3a5a3a'; c.fillRect(0,44,320,12);
    for(let x=0;x<320;x+=3){ const h = 3 + hash(x)%6; c.fillStyle = hash(x+3)%2 ? '#4f7d4a' : '#6fae62'; c.fillRect(x, 44-h + Math.sin(this.t*1.5 + x/20), 1, h); }
    drawSprite(c, CATERPILLAR, CAT_PAL, 196, 12, 2);
    c.fillStyle='rgba(219,191,239,.35)';
    for(let i=0;i<3;i++){ const p = (this.t*.35 + i/3) % 1; const r = 2 + p*5; const x = 204 - p*26, y = 14 - p*12;
      c.fillRect(x-r, y, 1, 1); c.fillRect(x+r, y, 1, 1); c.fillRect(x, y-r*.6, 1, 1); c.fillRect(x, y+r*.6, 1, 1); }
    drawSprite(c, ALICE_A, ALICE_PAL, 140, 26, 1.1);
  }
}

/* =============== flow =============== */
const LEVELS = [
  { n:'c1', file:'01_rabbit_hole.txt', make:()=>new FallLevel() },
  { n:'c2', file:'02_hall_of_doors.txt', make:()=>new HallLevel() },
  { n:'c3', file:'03_drink_me.txt', make:()=>new DrinkLevel() },
  { n:'c4', file:'04_pool_of_tears.txt', make:()=>new PoolLevel() },
  { n:'c5', file:'05_caterpillar.txt', make:()=>new CatLevel() }
];
const titleScene = new FallLevel(true);
const unlocked = i => state.unlockAll || i===0 || (state.prog[i-1]||0) > 0;
const totalTarts = () => Object.values(state.prog).reduce((a,b)=>a+b,0);

function startLevel(i){
  state.levelIdx = i; state.screen = 'play';
  $('#overlay').hidden = true; dlg.open = false; $('#dialog').hidden = true;
  state.level = LEVELS[i].make();
  setStatus({file: LEVELS[i].file});
  state.level.enter();
}
function finishLevel(tarts, stats){
  const i = state.levelIdx;
  state.prog[i] = Math.max(state.prog[i]||0, tarts); store.set('hiw.prog', state.prog);
  state.screen = 'results'; state.lastResult = {tarts, stats}; kbd.setTarget(null);
  renderResults(); sfx.win();
}
function renderResults(){
  const i = state.levelIdx, r = state.lastResult, L = LEVELS[i];
  const o = $('#overlay'); o.hidden = false;
  o.innerHTML = `<div class="card">
    <span class="ptag">${i+1} · ${tr(L.n+'_name')}</span>
    <h2>${tr('res_title')}</h2>
    <div class="tarts">${tartImgs(r.tarts)}</div>
    <p class="lesson">${tr(L.n+'_lesson')}</p>
    <div class="stats">${r.stats.map(([k,v])=>`<span>${tr(k)}<b>${v}</b></span>`).join('')}</div>
    <div class="actions"><button class="primary" id="rNext">${tr('next')} <kbd>Enter</kbd></button><button id="rAgain">${tr('replay')} <kbd>r</kbd></button><button id="rMenu">${tr('toMenu')} <kbd>m</kbd></button></div>
  </div>`;
  $('#rNext').onclick = resultsNext; $('#rAgain').onclick = ()=>startLevel(i); $('#rMenu').onclick = goMenu;
  panel(`<p>${tr(L.n+'_lesson')}</p>`);
}
function resultsNext(){ if(state.levelIdx+1 < LEVELS.length) startLevel(state.levelIdx+1); else renderEnd(); }
function renderEnd(){
  state.screen = 'end'; const o = $('#overlay'); o.hidden = false;
  o.innerHTML = `<div class="card"><h2>${tr('end_title')}</h2><div class="tarts">${tartImgs(Math.round(totalTarts()/5), 3)}</div>
    <p class="big">${tr('end_body', totalTarts())}</p><p>${tr('end_tease')}</p>
    <div class="actions"><button class="primary" id="eMenu">${tr('toMenu')} <kbd>Enter</kbd></button></div></div>`;
  $('#eMenu').onclick = goMenu;
}
function goMenu(){
  dlg.open = false; $('#dialog').hidden = true;
  state.screen = 'title'; state.level = null; showScene(); setMode('NOR'); kbd.setHelpers(['j','k']); kbd.setTarget(null);
  setStatus({file:'wonderland.txt', msg:'', keys:'', pos:'1:1'});
  renderTitle();
}
function renderTitle(){
  const o = $('#overlay'); o.hidden = false;
  const items = LEVELS.map((L,i)=>{
    const lk = !unlocked(i), t = state.prog[i]||0;
    const right = lk ? tr('locked') : (t ? tartImgs(t) : (i===0 ? tr('startHere') : tartImgs(0)));
    return `<li class="${i===state.menuSel?'sel':''} ${lk?'locked':''}" data-i="${i}"><span class="num">${i+1}</span><span><span class="cname">${tr(L.n+'_name')}</span><span class="cskill">${tr(L.n+'_skill')}</span></span><span class="ctarts">${right}</span></li>`;
  }).join('');
  o.innerHTML = `<div class="card">
    <h1 class="logo">${state.lang==='de' ? '<span class="hx">Helix</span> <small>im</small> Wunderland' : '<span class="hx">Helix</span> <small>in</small> Wonderland'}</h1>
    <p class="tag">${tr('tagline')}</p>
    <ol class="chapters">${items}</ol>
    <p class="hint">${tr('menuHint')}</p>
    <p class="touch">${tr('touch')}</p>
    <div class="actions"><button id="unlockBtn">${state.unlockAll ? tr('unlocked') : tr('unlockAll')}</button></div>
  </div>`;
  o.querySelectorAll('.chapters li').forEach(li => li.onclick = () => { const i = +li.dataset.i; if(unlocked(i)) startLevel(i); });
  $('#unlockBtn').onclick = (e) => { state.unlockAll = !state.unlockAll; store.set('hiw.all', state.unlockAll); e.currentTarget.blur(); renderTitle(); };
  panel(`<p class="big">${tr('tagline')}</p><p>${tr('kbdLegend')}</p>`);
}
function titleKey(e){
  const k = e.key;
  if(k==='j' || k==='ArrowDown'){ e.preventDefault(); state.menuSel = (state.menuSel+1) % LEVELS.length; sfx.tick(); kbd.flash('j',true); renderTitle(); }
  else if(k==='k' || k==='ArrowUp'){ e.preventDefault(); state.menuSel = (state.menuSel+LEVELS.length-1) % LEVELS.length; sfx.tick(); kbd.flash('k',true); renderTitle(); }
  else if(k==='Enter'){ e.preventDefault(); if(unlocked(state.menuSel)) startLevel(state.menuSel); else { sfx.bad(); toast(tr('locked')); } }
}

/* ---------------- settings ---------------- */
function applyI18n(){
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = tr(el.dataset.t));
  $('#lEN').setAttribute('aria-pressed', state.lang==='en'); $('#lDE').setAttribute('aria-pressed', state.lang==='de');
  [['kZ','qwertz'],['kC','qwertzch'],['kY','qwerty'],['kA','azerty']].forEach(([id,l]) => $('#'+id).setAttribute('aria-pressed', state.layout===l));
  $('#sndBtn').textContent = state.sound ? tr('soundOn') : tr('soundOff');
  $('#focusPrompt').textContent = tr('focus');
}
function setLang(l){
  if(l === state.lang) return;
  state.lang = l; store.set('hiw.lang', l); applyI18n(); kbd.build();
  if(state.screen==='title') renderTitle();
  else if(state.screen==='results') renderResults();
  else if(state.screen==='end') renderEnd();
  else if(state.level && state.level.onLang) state.level.onLang();
  if(dlg.open) showDlg();
}
function setLayout(l, auto){
  if(l === state.layout) return;
  state.layout = l; store.set('hiw.layout', l); applyI18n(); kbd.build();
  if(state.level && state.level.onLayout) state.level.onLayout();
  if(auto) toast(tr('layoutSwitched', LAYOUT_NAMES[l]));
}
function detectLayout(e){
  const qwertzFamily = state.layout==='qwertz' || state.layout==='qwertzch';
  if(e.key==='ß' || (e.code==='Backslash' && e.key==='#')) setLayout('qwertz', true);
  else if(e.code==='Backslash' && e.key==='$') setLayout('qwertzch', true);
  else if((e.code==='KeyQ' && e.key==='a') || (e.code==='KeyA' && e.key==='q') || (e.code==='Semicolon' && e.key==='m')) setLayout('azerty', true);
  else if(!qwertzFamily && ((e.code==='KeyY' && e.key==='z') || (e.code==='KeyZ' && e.key==='y') || ['ö','ä','ü'].includes(e.key))) setLayout('qwertz', true);
  else if((e.code==='Semicolon' && e.key===';') || (e.code==='KeyZ' && e.key==='z')) setLayout('qwerty', true);
}

/* ---------------- input ---------------- */
function onKey(e){
  if(e.ctrlKey && (e.key==='[' || e.code==='BracketLeft')){ e.preventDefault(); e = { key:'Escape', code:'Escape', preventDefault(){} , ctrlKey:false }; }
  if(e.metaKey || e.altKey || e.ctrlKey) return;
  if(e.key && e.key.length===1) detectLayout(e);
  if(dlg.open){
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); advanceDlg(); }
    else if(e.key.length===1 || e.key==='Escape'){ e.preventDefault(); const n = $('#dNext'); n.classList.remove('nudge'); void n.offsetWidth; n.classList.add('nudge'); }
    return;
  }
  if(state.screen==='title') return titleKey(e);
  if(state.screen==='results'){
    if(e.key==='Enter'){ e.preventDefault(); resultsNext(); } else if(e.key==='r'){ startLevel(state.levelIdx); } else if(e.key==='m'){ goMenu(); }
    return;
  }
  if(state.screen==='end'){ if(e.key==='Enter' || e.key==='m'){ e.preventDefault(); goMenu(); } return; }
  if(state.screen==='play' && state.level){
    if(e.key===' ' || e.key==='Backspace' || e.key==='Tab' || e.key==='Enter') e.preventDefault();
    state.level.key(e);
  }
}
window.addEventListener('keydown', onKey);
function updFocus(){ $('#focusPrompt').hidden = document.hasFocus(); }
window.addEventListener('focus', updFocus); window.addEventListener('blur', updFocus);
$('#focusPrompt').addEventListener('click', ()=>{ window.focus(); setTimeout(updFocus, 50); });
$('#stage').addEventListener('mousedown', ()=>{ window.focus(); setTimeout(updFocus, 50); });

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  tickDlg(dt);
  try{
    if((state.screen==='play' || state.screen==='results') && state.level){ if(state.screen==='play') state.level.tick(dt); state.level.draw(); }
    else { titleScene.tick(dt); titleScene.draw(); }
  }catch(err){ console.error(err); }
  requestAnimationFrame(frame);
}
applyI18n(); kbd.build(); goMenu(); updFocus();
requestAnimationFrame(frame);
</script>
